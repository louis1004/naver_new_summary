<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 뉴스 요약 (v3)</title>
    <style>
        /* CSS Variables for Theming - FORCED DARK MODE */
        :root {
            --bg-color: #0f1113;
            --box-bg: #1a1d21;
            --text-color: #e9ecef;
            --secondary-text: #adb5bd;
            --border-color: #2d3436;
            --primary-color: #00d1b2;
            --highlight-bg: #3d3b2a;
            --visited-color: #6c757d;
            --hover-bg: #212529;
            --accent-color: #3273dc;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
        }

        header {
            padding: 2rem 0;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            margin: 0;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 209, 178, 0.1);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 1.5rem;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .section-container {
            background-color: var(--box-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, border-color 0.2s;
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.25rem;
            margin: 0 0 1rem 0;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 1.25rem;
            background-color: var(--primary-color);
            margin-right: 0.75rem;
            border-radius: 2px;
        }

        .news-list { list-style: none; padding: 0; margin: 0; }
        
        .news-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }
        
        .news-item:last-child { border-bottom: none; }

        .news-link {
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .news-link:hover .title {
            color: var(--primary-color);
        }

        .time-meta {
            font-size: 0.75rem;
            color: var(--secondary-text);
            display: flex;
            gap: 0.5rem;
        }

        .title {
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 500;
            word-break: keep-all;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .sections-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .section-container { padding: 1rem; }
            .title { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen">
        <div class="spinner"></div>
        <p>최신 뉴스를 수집하고 있습니다. 잠시만 기다려 주세요...</p>
    </div>

    <header>
        <div class="container">
            <h1>뉴스 요약 V4</h1>
        </div>
    </header>

    <div class="container">
        <div id="content" class="sections-grid"></div>
    </div>

    <script>
        const SECTION_NAMES = {
            '100': '정치', '101': '경제', '102': '사회', '103': '생활/문화', '104': '세계'
        };

        // Fetch news from API
        async function loadNews() {
            try {
                const response = await fetch('/api/news');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const articles = await response.json();
                renderNews(articles);
                
                // Hide loading, show content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'grid';
            } catch (error) {
                document.getElementById('loading').innerHTML = `<p style="color:red">뉴스를 가져오는 데 실패했습니다.<br>${error.message}</p>`;
            }
        }

        function sophisticatedHighlight(text) {
             // Highlight [...] (...) '...' "..."
             return text.replace(/([\[\(\{].+?[\}\)\]])|(['"].+?['"])/g, '<span class="highlight">$1$2</span>');
        }

        function renderNews(articles) {
            const container = document.getElementById('content');
            
            // Safety check for null/invalid data
            if (!articles || !Array.isArray(articles)) {
                console.error('Invalid articles data:', articles);
                return;
            }
            
            // Group by section
            const grouped = {};
            articles.forEach(article => {
                if (!grouped[article.sectionId]) grouped[article.sectionId] = [];
                grouped[article.sectionId].push(article);
            });

            // Render
            Object.keys(SECTION_NAMES).forEach(sectionId => {
                if (!grouped[sectionId]) return;
                
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section-container';
                
                const title = document.createElement('h2');
                title.className = 'section-title';
                title.textContent = SECTION_NAMES[sectionId];
                sectionDiv.appendChild(title);
                
                const ul = document.createElement('ul');
                ul.className = 'news-list';
                
                grouped[sectionId].forEach(article => {
                    const li = document.createElement('li');
                    li.className = 'news-item';
                    
                    const link = document.createElement('a');
                    link.className = 'news-link';
                    link.href = `/view?url=${encodeURIComponent(article.url)}`;
                    
                    const timeMeta = document.createElement('div');
                    timeMeta.className = 'time-meta';
                    timeMeta.innerHTML = `<span>${article.press}</span> <span>•</span> <span>${formatTime(article.publishTime)}</span>`;
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'title';
                    titleDiv.innerHTML = sophisticatedHighlight(article.title);
                    
                    link.appendChild(timeMeta);
                    link.appendChild(titleDiv);
                    li.appendChild(link);
                    ul.appendChild(li);
                });
                
                sectionDiv.appendChild(ul);
                container.appendChild(sectionDiv);
            });
        }

        function formatTime(timeStr) {
            if (!timeStr) return '';
            const date = new Date(timeStr);
            const now = new Date();
            const diff = (now - date) / 1000 / 60; // minutes
        
            if (diff < 60) return `${Math.floor(diff)}분 전`;
            if (diff < 60 * 24) return `${Math.floor(diff / 60)}시간 전`;
            
            return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
        }

        // Start
        loadNews();
    </script>
</body>
</html>
